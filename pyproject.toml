[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spark-movie-recommender"
version = "0.1.0"
description = "PySpark ALS movie recommendation system using MovieLens data."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pyspark>=4.1.2,<5",
  "streamlit>=1.40",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["src"]
